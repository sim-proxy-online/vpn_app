buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.9.1+ нужен для compileSdk 36.
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
