plugins {
    id 'com.android.application'
}

// Единый источник версии — package.json в корне репозитория (его же читают Vite и
// UpdateChecker.ts). Раньше versionName приходилось менять вручную в трёх местах.
// versionCode по-прежнему поднимается вручную: он должен только расти.
def appVersionName = new groovy.json.JsonSlurper().parse(file('../../package.json')).version

android {
    namespace 'com.simproxy.app'
    // Google Play требует targetSdk 36 для новых приложений и обновлений (с 31.08.2026).
    compileSdk 36
    buildToolsVersion '36.0.0'

    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile file(props['storeFile'] ?: '../release.keystore')
                storePassword props['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias props['keyAlias'] ?: System.getenv("KEY_ALIAS") ?: "simproxy"
                keyPassword props['keyPassword'] ?: System.getenv("KEY_PASSWORD") ?: ""
            } else {
                storeFile file('../release.keystore')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: "simproxy"
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    defaultConfig {
        applicationId "party.petrovich.app"
        minSdk 24
        targetSdk 36
        versionCode 48
        versionName appVersionName
        // Ядро (xray) и туннель собираются только под ARM: x86-библиотек нет, и на x86 приложение не запустится.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            // uses default Android debug keystore
            buildConfigField 'boolean', 'PLAY_STORE', 'false'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField 'boolean', 'PLAY_STORE', 'false'
        }
        // Сборка для Google Play: ./gradlew :app:bundlePlay → app/build/outputs/bundle/play/*.aab.
        // Магазин сам доставляет обновления, поэтому самообновление через APK отключено
        // (BuildConfig.PLAY_STORE), а манифест src/play убирает лишние разрешения.
        play {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'PLAY_STORE', 'true'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // libxray.so — обычный исполняемый xray (PIE-ELF, остаток старой схемы «xray как
            // процесс», см. android/fetch-binaries.cjs). Сейчас ядро работает внутри libgojni.so
            // (in-process), libxray.so не подключает ни одна нативная библиотека, а
            // System.loadLibrary("xray") давно был обёрнут в try/catch. ~22 МБ в APK впустую.
            excludes.add('**/libxray.so')
        }
        // mihomo — это Go ELF-бинарь (CLI-ядро), упакованный как libmihomo.so и
        // исполняемый из nativeLibraryDir. НЕ стрипать: strip ломает Go-исполняемый файл.
        doNotStrip "**/libmihomo.so"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

// Нативные библиотеки в репозитории не лежат: туннель собирается android/native/build-tunnel.ps1,
// ядро xray (libgojni.so) приезжает внутри libs/simcore.aar (android/simcore/build-aar.ps1), а
// mihomo кладётся отдельно. Без них APK собирается «успешно», но падает на запуске (UnsatisfiedLinkError) —
// ошибка находится только на устройстве. Проверяем заранее, но лишь для задач упаковки:
// компиляция Java (например, в CI) этих файлов не требует.
// Проверка по умолчанию смотрит в src/main/jniLibs; для проверки другой папки:
//   ./gradlew :app:verifyNativeLibs -PnativeLibsDir=/path/to/jniLibs
def requiredNativeLibs = ['libhev-socks5-tunnel.so', 'libmihomo.so']
tasks.register('verifyNativeLibs') {
    doLast {
        def root = file(project.findProperty('nativeLibsDir') ?: 'src/main/jniLibs')
        def abis = ['arm64-v8a', 'armeabi-v7a'].findAll { new File(root, it).isDirectory() }
        if (abis.isEmpty()) {
            throw new GradleException(
                "Нет нативных библиотек: в ${root} нет ни arm64-v8a, ни armeabi-v7a. " +
                "Нужны libhev-socks5-tunnel.so (android/native/build-tunnel.ps1) и libmihomo.so.")
        }
        def missing = []
        abis.each { abi ->
            requiredNativeLibs.each { lib ->
                def f = new File(root, "${abi}/${lib}")
                if (!f.isFile() || f.length() == 0) missing << "${abi}/${lib}"
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Не хватает нативных библиотек: ${missing.join(', ')} (папка ${root})")
        }
        println "verifyNativeLibs: OK (${abis.join(', ')})"
    }
}
// Веб-часть (flags/, fonts/ и т.д.) попадает в assets при `npm run build` (плагин
// copy-to-android-assets в vite.config.ts). Если её забыли собрать, приложение без флагов и
// шрифтов компилируется «успешно» — проверяем заранее для задач упаковки.
tasks.register('verifyWebAssets') {
    doLast {
        def assets = file('src/main/assets')
        def missing = []
        ['index.html', 'flags/ru.svg', 'fonts', 'manifest.json'].each { rel ->
            if (!new File(assets, rel).exists()) missing << rel
        }
        if (!missing.isEmpty()) {
            throw new GradleException("В ${assets} нет веб-ресурсов: ${missing.join(', ')}. " +
                "Выполните `npm run build` в корне репозитория.")
        }
        println "verifyWebAssets: OK"
    }
}
// Привязка без tasks.whenTaskAdded/all: они принудительно создают ВСЕ задачи сразу, а AGP
// подключает артефакты лениво. Из-за этого R8 (minifyReleaseWithR8) начинал писать результат в
// тот же base.jar, который читает, и Gradle стирал его перед запуском (NoSuchFileException).
// Здесь трогаем только нужные задачи и только после того, как AGP создал варианты сборки.
afterEvaluate {
    ['packageDebug', 'packageRelease', 'packagePlay', 'bundleDebug', 'bundleRelease', 'bundlePlay'].each { n ->
        if (tasks.names.contains(n)) {
            tasks.named(n).configure { dependsOn 'verifyNativeLibs', 'verifyWebAssets' }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.material:material:1.12.0'

    // QR Scanning
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // Ядро xray-core в нашей обёртке (gomobile): android/simcore → libs/simcore.aar
    implementation files('libs/simcore.aar')
}
